
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocean Trash Catcher</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#06223a;
  color:white;
  font-family:monospace;
  text-align:center;
}
h1{color:#70eaff;margin:20px 0 5px}
.subtitle{color:#bdeeff;margin:8px}
.game{
  width:min(920px,96%);
  margin:20px auto;
  padding:15px;
  background:#0c3b59;
  border:4px solid #53d9ee;
  border-radius:12px;
}
.hud{
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
  padding:15px;
  color:#ffe77b;
  font-size:17px;
}
canvas{
  display:block;
  width:100%;
  height:auto;
  background:#087da9;
  border:3px solid white;
  image-rendering:pixelated;
}
button{
  background:#ffe66d;
  color:#092b43;
  border:3px solid white;
  padding:13px 22px;
  margin:12px 5px;
  font-family:monospace;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:white}
#message{color:#ffe77b;min-height:22px}
.controls{color:#c6eefa;line-height:1.8}
</style>
</head>
<body>

<h1>🌊 OCEAN TRASH CATCHER</h1>
<p class="subtitle">SDG 14: LIFE BELOW WATER</p>

<div class="game">

<div class="hud">
  <span>⭐ SCORE: <span id="score">0</span></span>
  <span>🗑️ TRASH: <span id="trash">0</span></span>
  <span>❤️ LIVES: <span id="lives">3</span></span>
  <span>⏱️ TIME: <span id="time">60</span></span>
</div>

<canvas id="game" width="900" height="520"></canvas>

<button onclick="startGame()">START GAME</button>
<button onclick="dropHook()">🎣 DROP HOOK</button>

<p id="message">Press START GAME to begin!</p>

<div class="controls">
  <p>⬅️ ➡️ Move your boat</p>
  <p>SPACE = Drop fishing hook</p>
  <p>Collect trash and avoid sea animals!</p>
</div>

</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let score=0,trash=0,lives=3,time=60;
let playing=false,items=[],particles=[],timer;

const player={x:450};

let hook={x:450,y:130,active:false,attached:null};

const objects=[
  {emoji:"🧴",points:10,type:"trash"},
  {emoji:"🥫",points:15,type:"trash"},
  {emoji:"🛍️",points:20,type:"trash"},
  {emoji:"🛞",points:25,type:"trash"},
  {emoji:"🐠",points:0,type:"fish"},
  {emoji:"🐢",points:0,type:"fish"}
];

function spawn(){
 const o=objects[Math.floor(Math.random()*objects.length)];
 items.push({
  x:30+Math.random()*820,
  y:230+Math.random()*240,
  emoji:o.emoji,
  points:o.points,
  type:o.type,
  speed:0.5+Math.random()*1.3
 });
}

function hud(){
 document.getElementById("score").textContent=score;
 document.getElementById("trash").textContent=trash;
 document.getElementById("lives").textContent=lives;
 document.getElementById("time").textContent=time;
}

function startGame(){
 clearInterval(timer);
 score=0;trash=0;lives=3;time=60;
 items=[];particles=[];
 player.x=450;
 hook={x:450,y:130,active:false,attached:null};
 playing=true;

 for(let i=0;i<12;i++)spawn();
 hud();

 document.getElementById("message").textContent="Clean the ocean! 🌊";

 timer=setInterval(()=>{
  if(!playing)return;
  time--;
  hud();
  if(time<=0)endGame();
 },1000);
}

function endGame(){
 playing=false;
 clearInterval(timer);
 document.getElementById("message").textContent=
 "🏆 GAME OVER! Score: "+score+" | Trash collected: "+trash;
}

function background(){
 // Sky
 ctx.fillStyle="#80dbee";
 ctx.fillRect(0,0,900,170);

 // Sun
 ctx.fillStyle="#ffe36a";
 ctx.fillRect(760,25,65,65);

 // Clouds
 ctx.fillStyle="white";
 ctx.fillRect(100,40,65,15);
 ctx.fillRect(115,25,35,20);
 ctx.fillRect(300,70,80,15);

 // Ocean
 ctx.fillStyle="#087da9";
 ctx.fillRect(0,170,900,350);

 ctx.fillStyle="#56d8ed";
 ctx.fillRect(0,170,900,8);

 // Water details
 ctx.fillStyle="#1599bb";
 for(let i=0;i<12;i++){
  ctx.fillRect((i*97)%900,210+i*24,50,4);
 }

 // Sand
 ctx.fillStyle="#d6b36d";
 ctx.fillRect(0,485,900,35);

 // Seaweed
 for(let i=0;i<10;i++){
  let x=i*100+20;
  ctx.fillStyle="#269c60";
  ctx.fillRect(x,450,8,35);
  ctx.fillRect(x-10,465,10,8);
  ctx.fillRect(x+8,445,10,8);
 }
}

function drawPlayer(){
 // Boat
 ctx.fillStyle="#a74f32";
 ctx.fillRect(player.x-45,70,90,30);

 // Cabin
 ctx.fillStyle="#f4f0d5";
 ctx.fillRect(player.x-30,45,60,25);

 // Fisher
 ctx.fillStyle="#e8a477";
 ctx.fillRect(player.x-18,35,36,35);

 ctx.fillStyle="#633d29";
 ctx.fillRect(player.x-20,30,40,12);

 ctx.fillStyle="#222";
 ctx.fillRect(player.x-13,49,5,5);
 ctx.fillRect(player.x+7,49,5,5);

 ctx.fillStyle="#3254a1";
 ctx.fillRect(player.x-15,70,30,8);
}

function drawHook(){
 ctx.strokeStyle="#5a3524";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(player.x,90);
 ctx.lineTo(hook.x,hook.y);
 ctx.stroke();

 ctx.strokeStyle="#ddd";
 ctx.lineWidth=4;
 ctx.beginPath();
 ctx.arc(hook.x,hook.y,9,0,Math.PI);
 ctx.stroke();
}

function drawItems(){
 items.forEach(i=>{
  ctx.font="30px Arial";
  ctx.textAlign="center";
  ctx.fillText(i.emoji,i.x,i.y);
 });
}

function drawParticles(){
 particles.forEach(p=>{
  ctx.fillStyle="#fff47a";
  ctx.fillRect(p.x,p.y,5,5);
  p.y-=1;
  p.life--;
 });
 particles=particles.filter(p=>p.life>0);
}

function dropHook(){
 if(!playing||hook.active)return;
 hook.x=player.x;
 hook.y=130;
 hook.active=true;
 hook.attached=null;
}

function update(){
 items.forEach(i=>{
  i.x+=i.speed;
  if(i.x>880||i.x<20)i.speed*=-1;
 });

 if(!hook.active)return;

 if(hook.attached){
  hook.y-=5;

  if(hook.y<=130){
   if(hook.attached.type==="trash"){
    score+=hook.attached.points;
    trash++;

    for(let i=0;i<8;i++){
     particles.push({
      x:hook.x,y:hook.y,life:20
     });
    }

    document.getElementById("message").textContent=
    "Great job! You cleaned the ocean! 🗑️";

    spawn();
   }else{
    lives--;
    document.getElementById("message").textContent=
    "Oops! Protect the sea creatures! 🐢";
   }

   items=items.filter(i=>i!==hook.attached);
   hook.attached=null;
   hook.active=false;
   hud();

   if(lives<=0)endGame();
  }

 }else{
  hook.y+=5;

  for(let i of items){
   if(Math.abs(hook.x-i.x)<25&&
      Math.abs(hook.y-i.y)<25){
    hook.attached=i;
    break;
   }
  }

  if(hook.y>=475)hook.active=false;
 }
}

function draw(){
 background();
 drawPlayer();
 drawHook();
 drawItems();
 drawParticles();
}

function loop(){
 if(playing){
  update();
  draw();
 }
 requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
 if(e.code==="ArrowLeft"){
  player.x=Math.max(45,player.x-25);
 }
 if(e.code==="ArrowRight"){
  player.x=Math.min(855,player.x+25);
 }
 if(e.code==="Space"){
  e.preventDefault();
  dropHook();
 }
});

draw();
loop();
</script>
</body>
</html>
